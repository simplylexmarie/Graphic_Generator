<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Content Calendar Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* A client's month for review: a calendar (an agenda on phones) or a list of every post with its
   graphic, a progress bar, and each post opening to graphic + copy side by side, where the client
   approves, asks for changes, declines, or leaves feedback. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#16202a; --muted:#5d6b73; --line:#dde3e6;
  --accent:#0f7fbf; --accent-ink:#ffffff; --accent-soft:#e3f1fa;
  --ok:#16794a; --ok-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fbecd0; --no:#b3261e; --no-soft:#fbe3e1;
  --pend:#6b7880; --pend-soft:#e8ecee;
  --shadow:0 1px 2px rgba(20,28,32,.06),0 8px 24px rgba(20,28,32,.08);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1417; --surface:#182026; --ink:#e8eef1; --muted:#9aa8b0; --line:#2a353c;
  --accent:#6cc0f0; --accent-ink:#06202f; --accent-soft:#16384b;
  --ok:#5fd39b; --ok-soft:#173a2a; --warn:#f0b756; --warn-soft:#3b2c0f; --no:#f28b82; --no-soft:#3d1a18;
  --pend:#9aa8b0; --pend-soft:#25303a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1417; --surface:#182026; --ink:#e8eef1; --muted:#9aa8b0; --line:#2a353c;
  --accent:#6cc0f0; --accent-ink:#06202f; --accent-soft:#16384b;
  --ok:#5fd39b; --ok-soft:#173a2a; --warn:#f0b756; --warn-soft:#3b2c0f; --no:#f28b82; --no-soft:#3d1a18;
  --pend:#9aa8b0; --pend-soft:#25303a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 clamp(16px,3vw,32px) 48px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto}

/* header */
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:28px 0 18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-size:clamp(26px,4vw,38px);line-height:1.1;margin:4px 0 0;font-weight:700;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted)}
.progress{display:flex;flex-direction:column;gap:6px;min-width:min(100%,300px)}
.progress .bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--pend-soft)}
.progress .bar i{display:block;height:100%}
.bar .approved{background:var(--ok)} .bar .changes{background:var(--warn)} .bar .declined{background:var(--no)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--pend)}
.dot.approved{background:var(--ok)} .dot.changes{background:var(--warn)} .dot.declined{background:var(--no)}

/* toolbar */
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-bottom:1px solid var(--line)}
.tools h2{font-family:var(--display);font-size:22px;margin:0 6px 0 0;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:170px;min-width:0}
.who input.need{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}

/* graphics */
.media{position:relative;background:var(--pend-soft);overflow:hidden;aspect-ratio:4/5}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--muted);font-size:13px}
.ring{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--pend);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ring.approved{background:var(--ok)} .ring.changes{background:var(--warn)} .ring.declined{background:var(--no)}

/* calendar */
.cal{margin-top:16px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:6px}
.dow div{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.out{background:transparent;border-style:dashed;opacity:.5}
.day .n{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.day .n .wd{display:none}
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{all:unset;display:block;cursor:pointer;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--surface);min-width:0}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .cap{padding:6px 8px 7px;display:block}
.tile .meta{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .txt{margin-top:2px;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

/* list */
.list{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.week{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 -4px;font-weight:700}
.row{all:unset;display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .media{border-radius:10px}
.when{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted);font-weight:500}
.when b{color:var(--ink);font-family:var(--display);font-size:17px}
.hook{font-family:var(--display);font-weight:700;font-size:18px;margin:8px 0 0;line-height:1.25}
.hook.muted{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.copy{margin:8px 0;white-space:pre-line;max-width:62ch;overflow-wrap:anywhere}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--pend-soft);color:var(--pend)}
.pill.approved{background:var(--ok-soft);color:var(--ok)} .pill.changes{background:var(--warn-soft);color:var(--warn)} .pill.declined{background:var(--no-soft);color:var(--no)}
.pill .dot{margin:0;background:currentColor}
.chip{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;border:1px solid var(--line);color:var(--accent);background:var(--accent-soft);text-transform:uppercase;letter-spacing:.04em}
.count{font-size:12px;color:var(--muted)}

/* dialog */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,12,14,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(1040px,100%);max-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);overflow:hidden}
.dlg .left{background:var(--bg);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:auto;min-width:0}
.stage{width:min(100%,420px)}
.stage .media{border-radius:12px;box-shadow:var(--shadow)}
.dlg .right{padding:24px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.dlg .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dlg h3{font-family:var(--display);font-size:22px;margin:4px 0 0;line-height:1.2;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.caption{white-space:pre-line;font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.go{border:0;border-radius:9px;padding:10px 16px;font-weight:700}
.go.ok{background:var(--ok);color:#fff}
.go.chg{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.go.no{background:none;color:var(--no);border:1px solid var(--no)}
.go.ghost{background:none;border:1px solid var(--line)}
.go[disabled]{opacity:.5;cursor:default}
.go[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.box{display:flex;flex-direction:column;gap:8px}
.box label{font-size:13px;font-weight:700}
.cmts{display:flex;flex-direction:column;gap:10px}
.cmt{font-size:14px;background:var(--bg);border-radius:10px;padding:8px 12px;overflow-wrap:anywhere;white-space:pre-line}
.cmt small{display:block;color:var(--muted);font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:0}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;flex:none}
.pn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:min(100%,420px);font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn[disabled]{opacity:.4;cursor:default}
.err{margin-top:40px;padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

@media (max-width:860px){
  .dlg{grid-template-columns:1fr;overflow:auto}
  .dlg .left,.dlg .right{overflow:visible}
  .row{grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px}
}
@media (max-width:760px){
  /* phones: the calendar becomes an agenda of only the days that have posts */
  .dow{display:none}
  .grid{display:flex;flex-direction:column;gap:10px}
  .day.blank,.day.out{display:none}
  .day{min-height:0}
  .day .n .wd{display:inline}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .who input{width:130px}
}
@media (prefers-reduced-motion:no-preference){.tile,.row{transition:border-color .15s,box-shadow .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">Brilliant Impact &middot; Content calendar</div>
      <h1 id="client">Content calendar</h1>
      <p class="sub" id="sub">Loading&hellip;</p>
    </div>
    <div class="progress" aria-live="polite">
      <div class="bar" id="bar" role="img" aria-label="Review progress"></div>
      <div class="legend" id="legend"></div>
    </div>
  </header>
  <div class="tools" id="tools" hidden>
    <h2 id="mlabel"></h2>
    <div class="seg" role="group" aria-label="View">
      <button id="vCal" aria-pressed="true">Calendar</button>
      <button id="vList" aria-pressed="false">Review list</button>
    </div>
    <div class="seg" role="group" aria-label="Show" id="filters"></div>
    <div class="spacer"></div>
    <label class="who">Reviewing as <input id="name" type="text" placeholder="Your name" autocomplete="name"></label>
  </div>
  <main id="main"></main>
</div>
<div id="layer"></div>
<script>
'use strict';
const T = new URLSearchParams(location.search).get('t');
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
};
const STATUS = { pending:'To review', approved:'Approved', changes:'Changes requested', declined:'Declined' };
const FILTERS = [['all','All'], ['pending','To review'], ['approved','Approved'], ['changes','Changes'], ['declined','Declined']];
const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };
let DATA = null, VIEW = store.get('review-view') || 'cal', FILTER = 'all', OPEN = -1;

const dateOf = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const longDay = iso => dateOf(iso).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
const shortDay = iso => dateOf(iso).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
const statusOf = p => (p.client && p.client.decision) || 'pending';
const when = at => new Date(at).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
const shown = () => DATA.posts.filter(p => FILTER === 'all' || statusOf(p) === FILTER);

async function load(){
  if (!T) return fail('This link is missing its code. Please use the full link you were sent.');
  try { DATA = await (await fetch('/api/review?t=' + encodeURIComponent(T))).json(); }
  catch { return fail('Couldn’t load the calendar. Check your connection and try again.'); }
  if (!DATA.ok) return fail(DATA.error || 'This link isn’t valid.');
  document.title = DATA.clientFull + ' — ' + DATA.label + ' content calendar';
  $('#client').textContent = DATA.clientFull;
  $('#sub').textContent = DATA.label + ' · ' + DATA.posts.length + ' posts for your review';
  $('#mlabel').textContent = DATA.label;
  $('#tools').hidden = false;
  const name = $('#name'); name.value = store.get('review-name');
  name.addEventListener('input', () => { store.set('review-name', name.value.trim()); name.classList.remove('need'); });
  $('#vCal').onclick = () => setView('cal'); $('#vList').onclick = () => setView('list');
  render();
}
function fail(msg){ $('#sub').textContent = ''; $('#main').replaceChildren(el('div', { class:'err' }, msg)); }
function setView(v){ VIEW = v; store.set('review-view', v); render(); }

function render(){
  // progress
  const n = { approved:0, changes:0, declined:0, pending:0 };
  DATA.posts.forEach(p => n[statusOf(p)]++);
  const total = DATA.posts.length || 1;
  $('#bar').replaceChildren(...['approved','changes','declined'].map(s => el('i', { class:s, style:'width:' + (100*n[s]/total) + '%' })));
  $('#bar').setAttribute('aria-label', n.approved + ' approved, ' + n.changes + ' with changes, ' + n.declined + ' declined, ' + n.pending + ' to review');
  $('#legend').replaceChildren(...['approved','changes','declined','pending'].map(s =>
    el('span', {}, el('span', { class:'dot ' + s }), n[s] + ' ' + STATUS[s].toLowerCase())));
  // toolbar
  $('#vCal').setAttribute('aria-pressed', String(VIEW === 'cal')); $('#vList').setAttribute('aria-pressed', String(VIEW === 'list'));
  $('#filters').replaceChildren(...FILTERS.map(([k, label]) => el('button', { 'aria-pressed':String(FILTER === k), onclick:() => { FILTER = k; render(); } },
    label + (k === 'all' ? '' : ' ' + n[k]))));
  const list = shown();
  $('#main').replaceChildren(!list.length ? el('div', { class:'empty' }, 'Nothing here — try another filter.')
    : VIEW === 'cal' ? calendar(list) : rows(list));
  if (OPEN >= 0) openPost(OPEN, true);
}

function media(p, big){
  return el('div', { class:'media' },
    p.graphic ? el('img', { src:p.graphic, alt:'Graphic for ' + longDay(p.iso), loading: big ? 'eager' : 'lazy' }) : el('div', { class:'none' }, 'Graphic coming soon'),
    el('span', { class:'ring ' + statusOf(p), title:STATUS[statusOf(p)] }));
}

function calendar(list){
  const first = dateOf(DATA.month + '-01'), m = first.getMonth();
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const cells = [];
  for (let d = new Date(start); d.getMonth() === m || d < first || cells.length % 7; d.setDate(d.getDate() + 1)) {
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const posts = list.filter(p => p.iso === iso), out = d.getMonth() !== m;
    cells.push(el('div', { class:'day' + (out ? ' out' : '') + (posts.length ? '' : ' blank') },
      el('div', { class:'n' }, el('span', { class:'wd' }, d.toLocaleDateString('en-US', { weekday:'long', month:'long' }) + ' '), String(d.getDate())),
      posts.length ? el('div', { class:'tiles' }, ...posts.map(p => el('button', { class:'tile', onclick:() => openPost(DATA.posts.indexOf(p)), 'aria-label':'Open the ' + longDay(p.iso) + ' post' },
        media(p), el('span', { class:'cap' }, el('span', { class:'meta' }, (p.bucket || 'Post') + ' · ' + STATUS[statusOf(p)]),
          el('span', { class:'txt' }, p.hook || p.post || ''))))) : null));
    if (cells.length > 42) break;
  }
  return el('section', { class:'cal' },
    el('div', { class:'dow' }, ...['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x => el('div', {}, x))),
    el('div', { class:'grid' }, ...cells));
}

function rows(list){
  const out = []; let wk = null;
  list.forEach(p => {
    const d = dateOf(p.iso), mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const key = mon.toDateString();
    if (key !== wk) { wk = key; out.push(el('div', { class:'week' }, 'Week of ' + mon.toLocaleDateString('en-US', { month:'long', day:'numeric' }))); }
    out.push(el('button', { class:'row', onclick:() => openPost(DATA.posts.indexOf(p)) },
      media(p),
      el('div', {},
        el('div', { class:'when' }, el('b', {}, longDay(p.iso)), p.bucket ? el('span', { class:'chip' }, p.bucket) : null, pill(p),
          (p.thread || []).length ? el('span', { class:'count' }, p.thread.length + ' note' + (p.thread.length === 1 ? '' : 's')) : null),
        p.hook ? el('div', { class:'hook' }, p.hook) : el('div', { class:'hook muted' }, 'Photo only — no headline on the graphic'),
        el('div', { class:'copy' }, p.post || ''))));
  });
  return el('section', { class:'list' }, ...out);
}
const pill = p => el('span', { class:'pill ' + statusOf(p) }, el('span', { class:'dot' }), STATUS[statusOf(p)]);

// ---------- one post: graphic and copy side by side ----------
function openPost(i, keep){
  OPEN = i;
  const p = DATA.posts[i]; if (!p) return closePost();
  const order = shown(), at = order.indexOf(p);
  const step = d => { const q = order[at + d]; if (q) openPost(DATA.posts.indexOf(q)); };
  let mode = null;                                     // which response box is open
  const area = el('textarea', { placeholder:'' });
  const send = el('button', { class:'go ok' }, 'Send');
  const box = el('div', { class:'box', hidden:true }, el('label', { for:'resp' }), area, el('div', { class:'actions' }, send,
    el('button', { class:'go ghost', onclick:() => { box.hidden = true; mode = null; marks(); } }, 'Cancel')));
  area.id = 'resp';
  const st = statusOf(p);
  const bApprove = el('button', { class:'go ok', 'aria-pressed':String(st === 'approved'), onclick:() => respond(p, 'approved', '') }, st === 'approved' ? 'Approved ✓' : 'Approve');
  const bChanges = el('button', { class:'go chg', 'aria-pressed':String(st === 'changes'), onclick:() => ask('changes') }, 'Request changes');
  const bDecline = el('button', { class:'go no', 'aria-pressed':String(st === 'declined'), onclick:() => ask('declined') }, 'Decline');
  const bNote = el('button', { class:'go ghost', onclick:() => ask('comment') }, 'Leave feedback');
  function marks(){ [bChanges, bDecline, bNote].forEach(b => b.style.outline = ''); }
  function ask(kind){
    mode = kind; box.hidden = false; marks();
    box.querySelector('label').textContent = kind === 'changes' ? 'What would you like changed?' : kind === 'declined' ? 'Why decline it? (optional)' : 'Your feedback';
    area.placeholder = kind === 'declined' ? 'e.g. Not the right time for this topic' : 'Type here…';
    send.textContent = kind === 'changes' ? 'Send changes' : kind === 'declined' ? 'Decline post' : 'Send feedback';
    send.className = 'go ' + (kind === 'declined' ? 'no' : kind === 'changes' ? 'chg' : 'ok');
    area.focus();
  }
  send.onclick = () => respond(p, mode, area.value.trim());

  const thread = (p.thread || []).slice().reverse();
  $('#layer').replaceChildren(el('div', { class:'scrim', onclick:e => { if (e.target === e.currentTarget) closePost(); } },
    el('div', { class:'dlg', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'dlgTitle' },
      el('div', { class:'left' },
        el('div', { class:'stage' }, media(p, true)),
        el('div', { class:'pn' },
          el('button', { class:'btn', disabled: at <= 0, onclick:() => step(-1), 'aria-label':'Previous post' }, '← Previous'),
          el('span', {}, 'Post ' + (at + 1) + ' of ' + order.length),
          el('button', { class:'btn', disabled: at >= order.length - 1, onclick:() => step(1), 'aria-label':'Next post' }, 'Next →'))),
      el('div', { class:'right' },
        el('div', { class:'top' },
          el('div', {}, el('div', { class:'eyebrow' }, longDay(p.iso)),
            el('h3', { id:'dlgTitle' }, p.hook || 'Photo only — no headline')),
          el('button', { class:'x', onclick:closePost, 'aria-label':'Close' }, '✕')),
        el('div', { class:'chips' }, p.bucket ? el('span', { class:'chip' }, p.bucket) : null, pill(p)),
        el('div', { class:'caption' }, p.post || ''),
        el('div', { class:'actions' }, bApprove, bChanges, bDecline, bNote),
        box,
        thread.length ? el('div', { class:'cmts' }, el('div', { class:'eyebrow' }, 'Notes on this post'),
          ...thread.map(c => el('div', { class:'cmt' },
            el('small', {}, (c.name || 'Someone') + ' · ' + ({ approved:'approved', changes:'asked for changes', declined:'declined', comment:'left feedback' })[c.decision] + ' · ' + when(c.at)),
            c.note || ''))) : null,
        el('p', { class:'hint' }, 'Your answers save as you go, and the team sees them right away.')))));
  document.body.style.overflow = 'hidden';
  if (!keep) $('#layer .x').focus();
}
function closePost(){ OPEN = -1; $('#layer').replaceChildren(); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => {
  if (OPEN < 0 || e.target.closest('textarea, input')) return;
  if (e.key === 'Escape') closePost();
  const order = shown(), at = order.indexOf(DATA.posts[OPEN]);
  if (e.key === 'ArrowRight' && order[at + 1]) openPost(DATA.posts.indexOf(order[at + 1]));
  if (e.key === 'ArrowLeft' && order[at - 1]) openPost(DATA.posts.indexOf(order[at - 1]));
});

async function respond(p, decision, note){
  const name = $('#name');
  if (!name.value.trim()) { name.classList.add('need'); name.focus(); alert('Please add your name under “Reviewing as” first, so the team knows who answered.'); return; }
  if ((decision === 'changes' || decision === 'comment') && !note) { alert('Please write your feedback first.'); return; }
  try {
    const r = await fetch('/api/review', { method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ t:T, postId:p.id, decision, note, name:name.value.trim() }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Couldn’t save that');
    if (j.client) p.client = j.client;
    if (j.entry && (j.entry.note || decision !== 'comment')) p.thread = (p.thread || []).concat([j.entry]);
    render();
  } catch (err) { alert(err.message); }
}
load();
</script>
</body>
