<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Social calendar review</title>
<style>
:root{
  --ink:#1d2a30; --muted:#66757c; --line:#e3e8ea; --ground:#f6f8f9; --card:#ffffff;
  --accent:#03a2c6; --ok:#1f9d55; --ok-soft:#e6f6ec; --warn:#c77700; --warn-soft:#fff4e0;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--ground)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:20px 16px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
.summary{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:14px}
.pill{padding:4px 10px;border-radius:999px;background:var(--ground);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);border-color:#bfe5cd;color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:#f3d7a5;color:var(--warn)}
main{padding:20px 0 60px}
.intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.name{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.name input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.post{display:grid;grid-template-columns:300px 1fr;gap:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.post.approved{border-color:#bfe5cd}
.post.changes{border-color:#f3d7a5}
.g img{width:100%;border-radius:8px;display:block;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.none{aspect-ratio:4/5;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:12px}
.when{font-weight:700}
.bucket{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-left:8px}
.hook{font-size:17px;font-weight:700;margin:8px 0}
.hook.muted{font-weight:400;color:var(--muted);font-size:14px}
.text{white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button.approve{background:var(--ok);border-color:var(--ok);color:#fff}
button.change{background:var(--card);border-color:var(--warn);color:var(--warn)}
button:disabled{opacity:.5;cursor:default}
textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-top:10px;min-height:80px}
.state{margin-top:12px;padding:8px 12px;border-radius:8px;font-size:14px}
.state.approved{background:var(--ok-soft);color:var(--ok)}
.state.changes{background:var(--warn-soft);color:var(--warn)}
.err{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
@media (max-width:720px){ .post{grid-template-columns:1fr} }
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="title">Social calendar</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="summary" id="summary"></div>
</div></header>
<main><div class="wrap" id="main"></div></main>
<script>
'use strict';
const T = new URLSearchParams(location.search).get('t');
const NAME_KEY = 'review-name';
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v != null && v !== false) n.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat()) if (c != null) n.append(c); return n; };
let DATA = null;
const dayLabel = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' }); };
function getName(){ try { return localStorage.getItem(NAME_KEY) || ''; } catch { return ''; } }
function setName(v){ try { localStorage.setItem(NAME_KEY, v); } catch {} }

async function load(){
  if (!T) return fail('This link is missing its code. Please use the full link you were sent.');
  try {
    const r = await fetch('/api/review?t=' + encodeURIComponent(T));
    DATA = await r.json();
  } catch { return fail('Couldn’t load the calendar. Check your connection and try again.'); }
  if (!DATA.ok) return fail(DATA.error || 'This link isn’t valid.');
  document.title = DATA.client + ' — ' + DATA.label + ' social calendar';
  $('#title').textContent = DATA.client + ' — ' + DATA.label;
  $('#sub').textContent = DATA.posts.length + ' posts for your review';
  render();
}
function fail(msg){ $('#sub').textContent = ''; $('#main').replaceChildren(el('div', { class:'err' }, msg)); }

function render(){
  const ok = DATA.posts.filter(p => p.client && p.client.decision === 'approved').length;
  const ch = DATA.posts.filter(p => p.client && p.client.decision === 'changes').length;
  $('#summary').replaceChildren(
    el('span', { class:'pill ok' }, ok + ' approved'),
    el('span', { class:'pill warn' }, ch + ' with changes'),
    el('span', { class:'pill' }, (DATA.posts.length - ok - ch) + ' to review'));
  const name = el('input', { type:'text', value:getName(), placeholder:'Your name', oninput:e => setName(e.target.value.trim()) });
  const main = $('#main');
  main.replaceChildren(
    el('div', { class:'intro' },
      el('div', {}, 'Please look over each post. Approve it as is, or tell us what you’d like changed.'),
      el('div', { class:'name' }, el('label', {}, 'Your name:'), name)),
    ...DATA.posts.map(postCard));
}

function postCard(p){
  const state = p.client && p.client.decision;
  const card = el('section', { class:'post ' + (state || '') });
  const note = el('textarea', { placeholder:'What would you like changed?', hidden:true });
  const send = el('button', { class:'change', hidden:true, onclick:() => respond(p, 'changes', note.value.trim(), send) }, 'Send changes');
  card.append(
    el('div', { class:'g' }, p.graphic ? el('img', { src:p.graphic, alt:'Graphic for ' + dayLabel(p.iso), loading:'lazy' }) : el('div', { class:'none' }, 'Graphic coming soon')),
    el('div', {},
      el('div', {}, el('span', { class:'when' }, dayLabel(p.iso)), p.bucket ? el('span', { class:'bucket' }, p.bucket) : null),
      p.hook ? el('div', { class:'hook' }, p.hook) : el('div', { class:'hook muted' }, 'Photo only — no headline on the graphic'),
      el('div', { class:'text' }, p.post || ''),
      state ? el('div', { class:'state ' + state },
        state === 'approved' ? '✓ Approved' : '✎ Changes requested', p.client.name ? ' by ' + p.client.name : '',
        p.client.note ? el('div', {}, '“' + p.client.note + '”') : null) : null,
      el('div', { class:'actions' },
        el('button', { class:'approve', onclick:e => respond(p, 'approved', '', e.target) }, state === 'approved' ? 'Approved ✓' : 'Approve'),
        el('button', { class:'change-open', onclick:() => { note.hidden = false; send.hidden = false; note.focus(); } }, 'Request changes')),
      note, send));
  return card;
}

async function respond(p, decision, note, btn){
  if (decision === 'changes' && !note) { alert('Please say what you’d like changed.'); return; }
  btn.disabled = true;
  try {
    const r = await fetch('/api/review', { method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ t:T, postId:p.id, decision, note, name:getName() }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Couldn’t save');
    p.client = j.client;
    render();
  } catch (err) { alert(err.message); btn.disabled = false; }
}
load();
</script>
</body>
</html>
